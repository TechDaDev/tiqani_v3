# =============================================================================
# tiqani_v3 — Development Docker Compose
# =============================================================================
# Start with:
#   cp .env.example .env
#   docker compose up --build
#
# This will start:
#   - PostgreSQL database
#   - Django development server (auto-reload)
#   - Redis (optional, for future queuing/caching)
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: tiqani_db
      POSTGRES_USER: tiqani_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiqani_user -d tiqani_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: tiqani_v3.settings.dev
      DATABASE_URL: postgres://tiqani_user:dev_password@db:5432/tiqani_db
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py seed_platform_fees &&
        python manage.py runserver 0.0.0.0:8000
      "

  # ───────────────────────────────────────────────────────────────────
  # Celery Worker — background task processor
  # ───────────────────────────────────────────────────────────────────
  celery_worker:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: tiqani_v3.settings.dev
      DATABASE_URL: postgres://tiqani_user:dev_password@db:5432/tiqani_db
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - .:/app
    command: celery -A tiqani_v3 worker -l info

  # ───────────────────────────────────────────────────────────────────
  # Celery Beat — periodic task scheduler
  # ───────────────────────────────────────────────────────────────────
  celery_beat:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: tiqani_v3.settings.dev
      DATABASE_URL: postgres://tiqani_user:dev_password@db:5432/tiqani_db
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - .:/app
    command: >
      sh -c "
        python manage.py migrate django_celery_beat --noinput &&
        python manage.py seed_celery_beat_schedule &&
        celery -A tiqani_v3 beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
      "

  # ───────────────────────────────────────────────────────────────────
  # MinIO — S3-compatible local object storage
  # Activate with:  docker compose --profile storage up
  # ───────────────────────────────────────────────────────────────────
  minio:
    profiles: ["storage"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data_dev:
  minio_data:
