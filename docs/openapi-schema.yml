components:
  schemas:
    ActivityLog:
      type: object
      description: Serializer for admin activity feed.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        actor_name:
          type: string
          readOnly: true
        verb:
          type: string
          readOnly: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        target_repr:
          type: string
          readOnly: true
        audience:
          allOf:
          - $ref: '#/components/schemas/AudienceEnum'
          readOnly: true
        metadata:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - actor_name
      - audience
      - created_at
      - id
      - metadata
      - target_id
      - target_repr
      - target_type
      - verb
    AdminActivity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor_name:
          type: string
          readOnly: true
        verb:
          type: string
          maxLength: 50
        target_type:
          type: string
          maxLength: 50
        target_id:
          type: string
          format: uuid
          nullable: true
        target_repr:
          type: string
          maxLength: 255
        audience:
          $ref: '#/components/schemas/AudienceEnum'
        metadata: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        actor:
          type: string
          format: uuid
          nullable: true
      required:
      - actor_name
      - created_at
      - id
      - verb
    AdminCashoutList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        dealership_name:
          type: string
          readOnly: true
        client_name:
          type: string
          readOnly: true
        client_username:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          title: Amount (IQD)
        status:
          $ref: '#/components/schemas/Status940Enum'
        confirmation_code_hash:
          type: string
          maxLength: 128
        code_expires_at:
          type: string
          format: date-time
          nullable: true
        confirmed_at:
          type: string
          format: date-time
          nullable: true
        idempotency_key:
          type: string
          nullable: true
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        dispute_reason:
          type: string
        dealership:
          type: integer
        client:
          type: string
          format: uuid
        wallet_transaction:
          type: string
          format: uuid
          nullable: true
        dealership_ledger_entry:
          type: integer
          nullable: true
          title: Ledger Entry
      required:
      - amount
      - client
      - client_name
      - client_username
      - created_at
      - dealership
      - dealership_name
      - id
    AdminContractDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        stages:
          type: string
          readOnly: true
        payment_breakdown:
          type: string
          readOnly: true
        payment_intents:
          type: string
          readOnly: true
        platform_earnings:
          type: string
          readOnly: true
        extension_requests:
          type: string
          readOnly: true
        is_delete:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        contract_reference:
          type: string
          description: 'Auto-generated unique contract reference (e.g., #A1B2C3D4E5F6)'
          maxLength: 20
        work_description:
          type: string
          nullable: true
          description: Detailed description of work to be performed
        agreed_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          nullable: true
          description: Total agreed amount in IQD (required before acceptance)
        amount_usd:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          description: USD equivalent for reference only
        currency:
          type: string
          description: Currency code for agreed amount
          maxLength: 3
        escrow_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          description: Amount held in escrow in IQD
        total_paid:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          description: Total amount paid to technician so far in IQD
        client_platform_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          description: Non-refundable client platform fee charged on contract activation
        technician_platform_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          description: Non-refundable technician platform fee charged on contract
            activation
        start_date:
          type: string
          format: date
          nullable: true
          description: Project start date provided by technician
        duration_days:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: Number of days for the project duration
        contract_duration:
          type: string
          format: date
          nullable: true
          description: Calculated deadline date (start_date + duration_days)
        status:
          allOf:
          - $ref: '#/components/schemas/Status065Enum'
          description: |-
            Current contract status

            * `draft` - Draft
            * `pending_acceptance` - Pending Acceptance
            * `pending_signatures` - Pending Signatures
            * `pending_finalization` - Pending Finalization
            * `in_progress` - In Progress
            * `completed` - Completed
            * `canceled` - Canceled
        stage_number:
          nullable: true
          description: |-
            Number of payment stages for this contract

            * `2` - 2 Stages
            * `3` - 3 Stages
            * `4` - 4 Stages
            * `5` - 5 Stages
          minimum: 0
          maximum: 32767
          oneOf:
          - $ref: '#/components/schemas/StageNumberEnum'
          - $ref: '#/components/schemas/NullEnum'
        client_accepted:
          type: boolean
          description: Client has accepted the contract
        technician_accepted:
          type: boolean
          description: Technician has accepted the contract
        finalized_at:
          type: string
          format: date-time
          nullable: true
          description: When the signed/final contract package was finalized
        client:
          type: string
          format: uuid
          description: Client initiating the contract
        technician:
          type: string
          format: uuid
          description: Technician performing the work
        finalized_by:
          type: string
          format: uuid
          nullable: true
          description: User who triggered finalization
      required:
      - client
      - created_at
      - extension_requests
      - id
      - payment_breakdown
      - payment_intents
      - platform_earnings
      - stages
      - technician
      - updated_at
