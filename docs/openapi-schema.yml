      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - code_issued
          - completed
          - disputed
          - expired
          - pending
          - reversed
        description: |-
          * `pending` - Pending
          * `code_issued` - Code Issued
          * `completed` - Completed
          * `cancelled` - Cancelled
          * `expired` - Expired
          * `disputed` - Disputed
          * `reversed` - Reversed
      tags:
      - admin
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminCashoutListList'
          description: ''
