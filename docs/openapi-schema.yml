openapi: 3.0.3
info:
  title: Tiqani API
  version: 16.0.0
  description: Backend API for Tiqani service marketplace, wallets, dealership finance,
    notifications, and admin operations.
paths:
  /api/accounts/me/:
    get:
      operationId: accounts_me_retrieve
      description: |-
        GET /api/accounts/me/ — return the current user's profile.
        PATCH /api/accounts/me/ — update safe user fields.
      tags:
      - accounts
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: accounts_me_partial_update
      description: |-
        GET /api/accounts/me/ — return the current user's profile.
        PATCH /api/accounts/me/ — update safe user fields.
      tags:
      - accounts
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/activity/:
    get:
      operationId: admin_activity_list
      description: GET /api/admin/activity/ — activity feed.
      parameters:
      - in: query
        name: actor
        schema:
          type: string
          format: uuid
      - in: query
        name: audience
        schema:
          type: string
          enum:
          - admin
          - system
          - user
        description: |-
          * `user` - User
          * `admin` - Admin
          * `system` - System
      - in: query
        name: created_at__gte
        schema:
          type: string
          format: date-time
      - in: query
        name: created_at__lte
        schema:
          type: string
          format: date-time
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: target_type
        schema:
          type: string
      - in: query
        name: verb
        schema:
          type: string
      tags:
      - admin
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminActivityList'
          description: ''
  /api/admin/contracts/:
    get:
      operationId: admin_contracts_list
      description: GET /api/admin/contracts/ — list all contracts.
      parameters:
      - in: query
        name: created_at__gte
        schema:
          type: string
          format: date-time
      - in: query
        name: created_at__lte
        schema:
          type: string
          format: date-time
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - canceled
          - completed
          - draft
          - in_progress
          - pending_acceptance
          - pending_finalization
          - pending_signatures
        description: |-
          Current contract status

          * `draft` - Draft
          * `pending_acceptance` - Pending Acceptance
          * `pending_signatures` - Pending Signatures
          * `pending_finalization` - Pending Finalization
          * `in_progress` - In Progress
          * `completed` - Completed
          * `canceled` - Canceled
      tags:
      - admin
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminContractListList'
          description: ''
  /api/admin/contracts/{id}/:
    get:
      operationId: admin_contracts_retrieve
      description: GET /api/admin/contracts/<id>/ — full detail.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminContractDetail'
          description: ''
  /api/admin/contracts/{id}/force-cancel/:
    post:
      operationId: admin_contracts_force_cancel_create
      description: POST /api/admin/contracts/<id>/force-cancel/ — system_admin only.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminContractForceCancelRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminContractForceCancelRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminContractForceCancelRequest'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminContractForceCancel'
          description: ''
