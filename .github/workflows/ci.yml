# =============================================================================
# tiqani_v3 — Continuous Integration
# =============================================================================
name: CI

on:
  push:
    branches: [dev, main, backend/phase-12-production-release]
  pull_request:
    branches: [dev, main, backend/phase-12-production-release]

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tiqani_test
          POSTGRES_USER: tiqani_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: tiqani_v3.settings.test
      SECRET_KEY: ci-secret-key-change-in-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://tiqani_test:test_password@localhost:5432/tiqani_test
      CORS_ALLOW_ALL_ORIGINS: "False"
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      CORS_ALLOW_CREDENTIALS: "True"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        run: |
          python manage.py check --settings=$DJANGO_SETTINGS_MODULE

      - name: Check pending migrations
        run: |
          python manage.py makemigrations --check --dry-run --settings=$DJANGO_SETTINGS_MODULE

      - name: Run tests
        run: |
          python manage.py test --settings=$DJANGO_SETTINGS_MODULE --verbosity=1

      - name: API consistency audit
        run: |
          python manage.py audit_api_consistency --settings=$DJANGO_SETTINGS_MODULE

      - name: Operations readiness check
        run: |
          python manage.py check_operations_ready --settings=$DJANGO_SETTINGS_MODULE

      - name: Generated schema validation
        run: |
          python manage.py spectacular --file /tmp/schema.yml --settings=$DJANGO_SETTINGS_MODULE
          python -c "import yaml; yaml.safe_load(open('/tmp/schema.yml')); print('Schema OK')"

      - name: Docker build smoke
        run: |
          docker build -t tiqani-backend-ci .
